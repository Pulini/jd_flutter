org.gradle.jvmargs=-Xmx4G
android.useAndroidX=true
android.enableJetifier=true
# 注意：android.defaults.buildfeatures.buildconfig 已在 AGP 9.0 移除，
# 如需 BuildConfig 请在 app/build.gradle 的 android.buildFeatures.buildConfig 中开启
android.nonTransitiveRClass=false
# AGP 9 的 R8「优化版资源压缩」要求 non-final 资源 ID，否则 release 构建会失败：
#   Execution failed for task ':app:minifyReleaseWithR8'
#   > Optimized resource shrinking requires non-final IDs.
# 本项目的 R.id / R.layout 仅用于 findViewById / setContentView 等运行时调用，
# 无 Java switch-case 与注解常量依赖（唯一 Java 文件为自动生成的
# GeneratedPluginRegistrant.java），故设为 true 是安全的。
android.nonFinalResIds=true
# 说明：原 `android.newDsl=false` 已移除。
# AGP 9+ 只读取新 DSL 接口，保留该标志会导致应用 Flutter Gradle 插件时失败
# （Flutter 提示：Starting AGP 9+, only the new DSL interface will be read）。
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
