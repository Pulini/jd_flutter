org.gradle.jvmargs=-Xmx4G
android.useAndroidX=true
android.enableJetifier=true
# 注意：android.defaults.buildfeatures.buildconfig 已在 AGP 9.0 移除，
# 如需 BuildConfig 请在 app/build.gradle 的 android.buildFeatures.buildConfig 中开启
android.nonTransitiveRClass=false
android.nonFinalResIds=false
# 说明：原 `android.newDsl=false` 已移除。
# AGP 9+ 只读取新 DSL 接口，保留该标志会导致应用 Flutter Gradle 插件时失败
# （Flutter 提示：Starting AGP 9+, only the new DSL interface will be read）。
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
